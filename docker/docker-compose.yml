services:
  postgres:
    image: postgres:17
    container_name: t2sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD in docker/.env}
      RO_PASSWORD: ${PG_RO_PASSWORD:?set PG_RO_PASSWORD in docker/.env}
    ports:
      # localhost only; 5433 so it does not clash with a local PostgreSQL on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
